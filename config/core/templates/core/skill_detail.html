<!DOCTYPE html>
<html>
<head>
    <title>{{ skill.name }}</title>
</head>

<body>

<h1>{{ skill.name }}</h1>

<p>
    {{ skill.description }}
</p>

<hr>

<h3>Assessment Information</h3>

<p>
    You will receive 5 practical questions.
</p>

<p>
    Questions are generated by AI.
</p>

<p>
    Passing Score:
    {{ skill.passing_score }}/100
</p>

<p>
    You must complete all 5 questions.
</p>

<br>

<a href="{% url 'start_assessment' skill.id %}">
    <button>
        Start Assessment
    </button>
</a>

<br><br>

<a href="{% url 'dashboard' %}">
    Back to Dashboard
</a>

</body>
</html>
