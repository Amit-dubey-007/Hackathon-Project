{% extends 'core/base.html' %}
{% load static %}

{% block title %}Preparing Assessment...{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/loader.css' %}">
{% endblock %}

{% block content %}
<div id="question-loader-active" data-url="{% url 'start_assessment' skill.id %}" class="row justify-content-center my-5">
    <div class="col-lg-8 text-center">
        <div class="card border-0 shadow-sm rounded-2xl overflow-hidden bg-white">
            <div class="card-body p-5">
                
                <div class="ai-loader-container">
                    <!-- Neural Net Animation -->
                    <div class="neural-net">
                        <div class="neural-node"></div>
                        <div class="neural-node"></div>
                        <div class="neural-node"></div>
                        <div class="neural-node"></div>
                        <div class="neural-node"></div>
                        
                        <div class="neural-line line-1"></div>
                        <div class="neural-line line-2"></div>
                        <div class="neural-line line-3"></div>
                        <div class="neural-line line-4"></div>
                    </div>
                    
                    <!-- Dynamic Text -->
                    <div class="status-messages w-100">
                        <div class="status-message active">Initializing Gemini AI...</div>
                    </div>
                    
                    <!-- Indeterminate Progress -->
                    <div class="progress-container mt-4 mb-3">
                        <div class="progress-indeterminate"></div>
                    </div>
                    
                    <p class="text-muted small fw-medium mt-4">
                        <i class="bi bi-info-circle text-primary me-1"></i> Generating unique assessment... Usually takes 5–15 seconds.
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/loader.js' %}"></script>
{% endblock %}
